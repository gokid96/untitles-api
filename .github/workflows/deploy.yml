name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time for the single server. A newer run waits instead of cancelling the current one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name (registry names must be lowercase)
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # For an arm64 server use linux/amd64,linux/arm64. No QEMU step is needed: only the Gradle stage runs commands, on the runner's own platform.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    # Production follows main. A manual run from another branch only builds and pushes its image.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      APP_DIR: ${{ vars.SERVER_APP_DIR || '/home/sungmin/untitle' }}

    steps:
      - name: Skip when the server is not configured
        if: env.SERVER_HOST == ''
        run: echo "::warning title=Deploy skipped::The SERVER_HOST secret is not set. The image was pushed, nothing was deployed."

      - name: Check the pinned host key
        if: env.SERVER_HOST != ''
        env:
          SERVER_SSH_FINGERPRINT: ${{ secrets.SERVER_SSH_FINGERPRINT }}
        # The SSH actions skip host key verification when the fingerprint is empty.
        run: |
          if [[ ! $SERVER_SSH_FINGERPRINT =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "::error::SERVER_SSH_FINGERPRINT must be the server's host key fingerprint in the form SHA256:<43 characters>"
            exit 1
          fi

      - name: Checkout
        if: env.SERVER_HOST != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Secrets reach the server only inside these files. The ssh-action `envs` would put them on the
      # remote shell's command line, which every account on the server can read in the process list.
      - name: Write the env files for the server
        if: env.SERVER_HOST != ''
        env:
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
          DB_HOST: mysql
          REDIS_HOST: redis
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          umask 077

          app_vars=(JWT_SECRET DB_HOST DB_USERNAME DB_PASSWORD REDIS_HOST REDIS_PASSWORD
            AWS_ACCESS_KEY AWS_SECRET_KEY R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT
            R2_BUCKET_NAME R2_PUBLIC_URL GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET KAKAO_CLIENT_ID
            KAKAO_CLIENT_SECRET NAVER_CLIENT_ID NAVER_CLIENT_SECRET)

          missing=()
          for name in GHCR_TOKEN MYSQL_ROOT_PASSWORD CLOUDFLARE_TUNNEL_TOKEN "${app_vars[@]}"; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub secrets: ${missing[*]}"
            exit 1
          fi
          if [ "$DB_USERNAME" = root ]; then
            echo "::error::DB_USERNAME must not be root (MySQL creates it as a separate application user)"
            exit 1
          fi

          # .env feeds compose interpolation (the tunnel token only reaches cloudflared); api.env is the api container's env_file.
          compose_vars=(IMAGE_NAME IMAGE_TAG DB_USERNAME DB_PASSWORD REDIS_PASSWORD
            MYSQL_ROOT_PASSWORD CLOUDFLARE_TUNNEL_TOKEN)

          # Values are written as NAME='value', which keeps $, #, spaces and double quotes literal for
          # docker compose. Single quotes, backslashes and newlines are refused: they do not survive
          # that quoting, and the MySQL image puts DB_PASSWORD into SQL without escaping them.
          for name in "${compose_vars[@]}" "${app_vars[@]}"; do
            case "${!name}" in
              *"'"* | *\\* | *$'\n'*)
                echo "::error::$name contains a single quote, a backslash or a newline"
                exit 1 ;;
            esac
          done
          # Mode 600 (umask above); the archive of the copy step keeps it on the server.
          write_env() { for name in "$@"; do printf "%s='%s'\n" "$name" "${!name}"; done; }
          write_env "${compose_vars[@]}" > .env
          write_env "${app_vars[@]}" > api.env
          printf '%s' "$GHCR_TOKEN" > .registry-token

      - name: Prepare the upload directory
        if: env.SERVER_HOST != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          envs: APP_DIR
          # The next step uploads its archive (with the env files) here, readable only by SERVER_USER,
          # instead of the home directory, and unpacks it into APP_DIR.
          script: |
            set -eu
            umask 077
            mkdir -p "${APP_DIR:?}/.upload"
            chmod 700 "$APP_DIR/.upload"

      - name: Copy the files to the server
        if: env.SERVER_HOST != ''
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          source: docker-compose.prod.yml,deploy/Caddyfile,.env,api.env,.registry-token
          target: ${{ env.APP_DIR }}
          tar_tmp_path: ${{ env.APP_DIR }}/.upload/

      - name: Deploy on the server
        if: env.SERVER_HOST != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          command_timeout: 15m
          # Public values only: drone-ssh sends envs as export lines inside the remote command line.
          envs: IMAGE_NAME,IMAGE_TAG,APP_DIR,GHCR_USER
          # Runs in the login shell of SERVER_USER (bash on Ubuntu). The secrets are in the files the
          # previous step unpacked (mode 600); do not add `set -x`.
          script: |
            set -euo pipefail
            umask 077
            cd "${APP_DIR:?}"
            # The registry token file is only needed for the login below.
            trap 'rm -f .registry-token' EXIT

            # Registry logins for this app live next to it, so ~/.docker/config.json (other projects'
            # logins on this shared host) is never read or overwritten.
            export DOCKER_CONFIG="$PWD/.docker"
            mkdir -p "$DOCKER_CONFIG"
            # Logs in to the registry of the image (ghcr.io).
            docker login "${IMAGE_NAME%%/*}" -u "$GHCR_USER" --password-stdin < .registry-token
            rm -f .registry-token

            dc() { docker compose -f docker-compose.prod.yml "$@"; }
            dc pull api
            dc up -d --remove-orphans

            echo "Waiting for the api to report UP"
            health=""
            for _ in $(seq 1 60); do
              health=$(dc exec -T caddy wget -qO- http://api:8070/actuator/health 2> /dev/null || true)
              case "$health" in *'"status":"UP"'*) break ;; esac
              sleep 5
            done
            case "$health" in
              *'"status":"UP"'*) echo "api is UP on $IMAGE_TAG" ;;
              *)
                echo "::error::The api did not report UP within 5 minutes"
                dc ps
                dc logs --no-color --tail=200 api
                exit 1 ;;
            esac

            # Picks up a changed Caddyfile without a restart; a no-op when nothing changed.
            dc exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile

            # Commit-sha tags never become dangling, so drop this app's api images that are no longer used.
            # Only tags of this repository: other projects' images on this shared host are left alone.
            for ref in $(docker image ls "$IMAGE_NAME" --format '{{.Repository}}:{{.Tag}}'); do
              [ "$ref" = "$IMAGE_NAME:$IMAGE_TAG" ] || docker image rm "$ref" > /dev/null 2>&1 || true
            done

            # cloudflared's healthcheck (`cloudflared tunnel ready`) passes once a connection to Cloudflare
            # is registered; without one the API is unreachable from the internet even though it is UP.
            echo "Waiting for the Cloudflare tunnel"
            tunnel=""
            for _ in $(seq 1 24); do
              tunnel=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$(dc ps -a -q cloudflared)" 2> /dev/null || true)
              [ "$tunnel" = healthy ] && break
              sleep 5
            done
            if [ "$tunnel" != healthy ]; then
              echo "::error title=Tunnel not connected::cloudflared has no registered connection to Cloudflare after 2 minutes (health: ${tunnel:-none}). The api runs $IMAGE_TAG but cannot be reached through Cloudflare. Check the CLOUDFLARE_TUNNEL_TOKEN secret and the tunnel in the Cloudflare dashboard."
              dc ps -a cloudflared
              dc logs --no-color --tail=50 cloudflared
              exit 1
            fi
            echo "cloudflared is connected to Cloudflare"

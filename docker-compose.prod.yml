# Production stack for one Docker host, deployed by hand (see "Deployment" in README.md).
# No service publishes a host port: cloudflared keeps an outbound Cloudflare Tunnel, Cloudflare
# terminates HTTPS for the API hostname and the tunnel forwards plain HTTP to caddy:80 on this
# compose network. The api image is built on this host from the repository.
# Two files next to this one hold the secrets (mode 600, both in .gitignore):
#   .env     compose interpolation: DB_USERNAME, DB_PASSWORD, REDIS_PASSWORD,
#            MYSQL_ROOT_PASSWORD, CLOUDFLARE_TUNNEL_TOKEN
#   api.env  environment of the api container (no MYSQL_ROOT_PASSWORD, no tunnel token)
#   collab.env  environment of the collab container: JWT_SECRET and COLLAB_SECRET, both equal to api.env
name: untitles

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    # Remotely managed tunnel: the route from the API hostname to http://caddy:80 is set in
    # the Cloudflare dashboard. The token reaches only this container.
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is not set}
      # Metrics stay on the container's loopback; `tunnel ready` below reads /ready there.
      TUNNEL_METRICS: 127.0.0.1:2000
    healthcheck:
      # The image has no shell. `tunnel ready` exits 0 once a connection to Cloudflare is registered.
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    depends_on:
      - caddy
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    volumes:
      # Directory mount, so `caddy reload` sees a Caddyfile updated by `git pull`.
      - ./deploy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  api:
    # Built on this host from the repository's Dockerfile, for the host's own CPU architecture.
    build:
      context: .
      labels:
        app: untitles-api # `docker image prune -f --filter label=app=untitles-api` removes only old api images
    image: untitles-api:local
    restart: unless-stopped
    env_file: api.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  collab:
    # Realtime note editing (Hocuspocus). Caddy routes /collab to it; it reads and stores notes
    # through the api's /internal/collab endpoints over this network, authenticated by COLLAB_SECRET.
    build:
      context: ./collab
      labels:
        app: untitles-collab
    image: untitles-collab:local
    restart: unless-stopped
    # collab.env (mode 600, in .gitignore): JWT_SECRET (same as api.env) and COLLAB_SECRET (same as api.env)
    # Optional so a host without collab.env still deploys; the web client then falls back to normal saving.
    env_file:
      - path: collab.env
        required: false
    environment:
      API_INTERNAL_URL: http://api:8070
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1234/ > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: untitles # database in spring.datasource.url of application-prod.yml
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is not set}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is not set}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Logs in as the app user over TCP. The temporary server of the first-time init skips
      # networking, so it never counts as healthy. $$ is expanded by the shell in the container.
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -e "SELECT 1" "$$MYSQL_DATABASE" > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
      start_interval: 3s
    logging: *logging

  redis:
    image: redis:7.2.16-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set}
    # Cache only: no RDB snapshots, no AOF. The password goes in as config on stdin ("-"): as an
    # argument, every account on the host could read it in the process list while Redis starts.
    command:
      - sh
      - -c
      - |
        exec redis-server --save "" --appendonly no - <<EOF
        requirepass '$$REDIS_PASSWORD'
        EOF
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s
    logging: *logging

volumes:
  mysql-data:
  caddy-data:
  caddy-config:

spring:
  profiles:
    active: dev

  application:
    name: untitles-api

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname
              - account_email

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-name: Naver
            scope:
              - name
              - email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# jwt 설정 (spring 블록 밖, 최상위)
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000    # 30분 (ms)
  refresh-token-expiration: 5184000000 # 60일 (ms). 재발급할 때마다 새로 60일 (앱에서는 쓰는 동안 계속 로그인 유지)

server:
  port: 8070
  forward-headers-strategy: native
  tomcat:
    mbeanregistry:
      enabled: true

# 모니터링용 메트릭 수집, 엔드포인트 자동 추가
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      tomcat: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: untitles-api

aws:
  ses:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
    region: ap-northeast-2
    from-email: noreply@untitles.net

cloudflare:
  r2:
    access-key: ${R2_ACCESS_KEY_ID}
    secret-key: ${R2_SECRET_ACCESS_KEY}
    endpoint: ${R2_ENDPOINT}
    bucket: ${R2_BUCKET_NAME}
    public-url: ${R2_PUBLIC_URL}

spring.mail:
  # MAIL_PROVIDER=smtp 일 때 사용. 서버 환경변수 SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true
    mail.smtp.connectiontimeout: 10000
    mail.smtp.timeout: 10000

app:
  mail:
    # 메일 발송 수단: log(발송하지 않고 로그만, 기본) | smtp | ses
    provider: ${MAIL_PROVIDER:log}
    from: ${MAIL_FROM:noreply@untitles.net}
  oauth2:
    redirect-uri: http://localhost:5173
  signup:
    # 회원가입 시 이메일 인증 필수 여부. 메일 발송 수단을 붙이면 EMAIL_VERIFICATION_REQUIRED=true로 켠다
    email-verification-required: ${EMAIL_VERIFICATION_REQUIRED:false}
